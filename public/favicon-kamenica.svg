<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Makedonska Kamenica: the miners' crossed hammer and pick (Саса), over the hills of Осогово -->
  <rect x="3" y="3" width="94" height="94" rx="14" fill="#f4ede0" stroke="#7a1f1a" stroke-width="6"/>
  <path d="M8 80 L28 62 L42 72 L60 54 L78 68 L92 60 V90 H8 Z" fill="#7a1f1a" opacity="0.35"/>
  <g fill="#1f2a44">
    <!-- the hammer: handle from bottom left to top right, head across its top -->
    <rect x="46" y="16" width="7" height="66" rx="2" transform="rotate(45 50 50)"/>
    <rect x="57" y="20" width="30" height="13" rx="2" transform="rotate(45 72 26.5)"/>
    <!-- the pick: handle from bottom right to top left, curved blade across its top -->
    <rect x="46" y="16" width="7" height="66" rx="2" transform="rotate(-45 50 50)"/>
    <path d="M14 34 Q22 16 40 12 L44 16 Q28 22 20 38 Z"/>
  </g>
</svg>
