<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town map extents</title>
<style>:root{--text-primary:#0b0b0b;--text-secondary:#52514e}body{margin:0;padding:16px;background:#fcfcfb;font-family:system-ui,sans-serif;color:var(--text-primary)}#wrap{max-width:1600px;margin:auto}#map svg{border:1px solid #e1e0d9;border-radius:8px;background:#fff;cursor:grab;display:block}</style></head><body><div id="wrap">
<div id="legend" style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-secondary);margin:0 0 8px"></div>
<div id="map" style="width:100%"></div>
<div style="font-size:12px;color:#898781;margin:6px 0">Scroll to zoom, drag to pan.</div><div id="ov" style="font-size:13px;color:var(--text-secondary);margin-top:8px;line-height:1.6"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<!-- the zones come from src/zones.ts (one list with the app's country view): open this page through `npm run dev`,
     http://localhost:5173/scripts/towns-map.html -->
<script type="module">
import { EXISTING as existing, PLANNED as planned, CUTS as cuts, SHAPES as shapes, LABEL_AT as labelAt, outline } from '/src/zones.ts';
const dark=false;const EX='#1f2a44';
const inCut=(c,la,lo)=>la>=c[0]-1e-9&&la<=c[2]+1e-9&&lo>=c[1]-1e-9&&lo<=c[3]+1e-9;
const inside=(b,la,lo)=>shapes[b[0]]?d3.polygonContains(shapes[b[0]],[lo,la]):la>=b[1]&&la<=b[3]&&lo>=b[2]&&lo<=b[4]&&!(cuts[b[0]]||[]).some(c=>la>c[0]&&la<c[2]&&lo>c[1]&&lo<c[3]);
const SG='#888780',sh=[0.05,0.07];
const singles=[].map(([n,la,lo])=>[n,la-sh[0],lo-sh[1],la+sh[0],lo+sh[1],SG]);
const points=[['Белчишта',41.30,20.83],['Матка',41.95,21.30]];
const sw=(c,d)=>`<span style="width:10px;height:10px;border-radius:2px;background:${c};opacity:${d?0.5:0.85};display:inline-block"></span>`;
document.getElementById('legend').innerHTML=`<b style="font-weight:600;color:#0b0b0b">Done:</b><span style="display:flex;gap:4px;align-items:center">${sw(EX)}on the site (solid, ✓)</span><b style="font-weight:600;color:#0b0b0b;margin-left:12px">To do (dashed, pale):</b>`+planned.map(p=>`<span style="display:flex;gap:4px;align-items:center">${sw(p[5])}${p[0]}</span>`).join('')+(singles.length?`<span style="display:flex;gap:4px;align-items:center">${sw(SG,1)}Single towns (rough)</span>`:'')+`<span style="display:flex;gap:4px;align-items:center"><span style="width:10px;height:10px;background:repeating-linear-gradient(45deg,#d03b3b 0 2px,transparent 2px 4px);display:inline-block"></span>Overlap</span>`;
const W=1400,H=1060;const root=d3.select('#map').append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%');const svg=root.append('g');root.call(d3.zoom().scaleExtent([1,12]).on('zoom',e=>{svg.attr('transform',e.transform);svg.selectAll('text').attr('font-size',16/e.transform.k);svg.selectAll('circle').attr('r',4/e.transform.k);svg.selectAll('rect,path').attr('stroke-width',1.5/e.transform.k);}));
root.append('defs').html('<pattern id="hz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="#d03b3b"/></pattern>');
const ext={type:'Feature',geometry:{type:'Polygon',coordinates:[[[20.44,40.66],[20.44,42.40],[23.04,42.40],[23.04,40.66],[20.44,40.66]]]}};
const proj=d3.geoMercator().fitExtent([[6,6],[W-6,H-6]],ext);const path=d3.geoPath(proj);const ink='#52514e',muted='#898781';
function rect(b){const a=proj([b[2],b[3]]),c=proj([b[4],b[1]]);return{x:a[0],y:a[1],w:c[0]-a[0],h:c[1]-a[1]};}
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(w=>{const f=topojson.feature(w,w.objects.countries).features;svg.insert('g',':first-child').selectAll('path').data(f).join('path').attr('d',path).attr('fill',d=>d.id==='807'?'#f0efec':'none').attr('stroke',d=>d.id==='807'?ink:muted).attr('stroke-width',d=>d.id==='807'?1:0.5).attr('stroke-dasharray',d=>d.id==='807'?null:'2 3');draw();}).catch(()=>draw());
function box(b,col,op,dash,sw){if(cuts[b[0]]||shapes[b[0]]){svg.append('path').attr('d','M'+outline(b).map(p=>proj(p).join(',')).join('L')+'Z').attr('fill',col).attr('fill-opacity',op).attr('stroke',col).attr('stroke-width',sw||1.5).attr('stroke-dasharray',dash||null);return;}const r=rect(b);svg.append('rect').attr('x',r.x).attr('y',r.y).attr('width',r.w).attr('height',r.h).attr('fill',col).attr('fill-opacity',op).attr('stroke',col).attr('stroke-width',sw||1.5).attr('stroke-dasharray',dash||null);}
function label(t,x,y,a,c,wt){svg.append('text').attr('x',x).attr('y',y).attr('text-anchor',a||'middle').attr('font-size',16).attr('font-weight',wt||400).attr('fill',c||'#0b0b0b').text(t);}
function draw(){const all=[...existing.map(e=>[...e,EX,'e']),...planned.map(p=>[...p,'p']),...singles.map(s=>[...s,'s'])];
existing.forEach(e=>box(e,EX,0.72,null,2));planned.forEach(p=>box(p,p[5],0.16,'7 4'));singles.forEach(s=>box(s,SG,0.12,'7 4'));
const ov=[];for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const A=all[i],B=all[j];if(A[6]==='e'&&B[6]==='e')continue;const s=Math.max(A[1],B[1]),n=Math.min(A[3],B[3]),wv=Math.max(A[2],B[2]),e=Math.min(A[4],B[4]);
let cut=true;for(let i=0;i<=8&&cut;i++)for(let j=0;j<=8&&cut;j++){const la=s+(n-s)*(0.02+0.96*i/8),lo=wv+(e-wv)*(0.02+0.96*j/8);if(inside(A,la,lo)&&inside(B,la,lo))cut=false;}
if(n-s>1e-4&&e-wv>1e-4&&!cut){const r=rect(['',s,wv,n,e]);svg.append('rect').attr('x',r.x).attr('y',r.y).attr('width',Math.max(r.w,1.5)).attr('height',Math.max(r.h,1.5)).attr('fill','url(#hz)').attr('stroke','#d03b3b');ov.push(`${A[0]} ↔ ${B[0]}: ${((n-s)*111).toFixed(1)} × ${((e-wv)*111*Math.cos(41.5*Math.PI/180)).toFixed(1)} km`);}}
points.forEach(([n,la,lo])=>{const[x,y]=proj([lo,la]);svg.append('circle').attr('cx',x).attr('cy',y).attr('r',4).attr('fill',ink);label(n,x+6,y-5,'start');});
all.forEach(b=>{const r=rect(b);const done=b[6]==='e';const t=done?'✓ '+b[0]:b[0];const fits=t.length*9+10<r.w;const at=labelAt[b[0]]&&proj([labelAt[b[0]][1],labelAt[b[0]][0]]);if(at){label(t,at[0],at[1]+5,'middle','#0b0b0b',400);return;}label(t,r.x+r.w/2,fits?r.y+r.h/2+5:r.y+r.h+17,'middle',done&&fits?'#f4ede0':(done?'#1f2a44':'#0b0b0b'),done?600:400);});
document.getElementById('ov').innerHTML='<b>Overlaps:</b> '+(ov.length?ov.join(' · '):'none');}
</script></body></html>
